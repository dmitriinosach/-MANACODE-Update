name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: go test -count=1 ./...

      - name: Build
        shell: pwsh
        run: go build -trimpath "-ldflags=-H=windowsgui -X main.zipPass=raids-circle" -o dist/ManacodeUpdate.exe .

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          $text = [Text.Encoding]::GetEncoding(28591).GetString([IO.File]::ReadAllBytes("dist/ManacodeUpdate.exe"))
          if (-not $text.Contains("MANACODE-UPDATER-VERSION=$v;")) { throw "exe version is not $($v), bump updaterVersion in place.go" }

      - name: Upload unsigned
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ManacodeUpdate
          path: dist/ManacodeUpdate.exe

      - name: Sign
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "dist/ManacodeUpdate.exe"
          $signed = "unsigned"
          if (Test-Path "signed/ManacodeUpdate.exe") { $exe = "signed/ManacodeUpdate.exe"; $signed = "signed by SignPath Foundation" }
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $v = "${{ github.ref_name }}".TrimStart("v")
          @(
            "Программа ставит и обновляет аддоны Manacode для WoW 3.3.5a (WoW Circle) и данные PlayerRaidsInfo.",
            "",
            "Скачайте ``ManacodeUpdate.exe`` и положите куда удобно: в ``Interface\AddOns`` или на рабочий стол — новую версию кладите на место старой. Себя программа не обновляет: когда выйдет новая, внизу окна появится «Вышла ManacodeUpdate X — скачать вручную».",
            "",
            "Built from source by GitHub Actions, $signed.",
            "",
            "sha256: ``$sha``"
          ) | Set-Content -Encoding utf8 dist/notes.md
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item $exe dist/release/ManacodeUpdate.exe -Force
          gh release create "${{ github.ref_name }}" dist/release/ManacodeUpdate.exe --title "ManacodeUpdate $v" --notes-file dist/notes.md --prerelease
